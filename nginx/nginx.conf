events {
    worker_connections 1024;
}

http {
    upstream proxy_backend {
        server proxy:8000;
    }

    upstream dashboard_frontend {
        server dashboard:3000;
    }

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

    server {
        listen 80;
        server_name _;

        # Proxy API endpoints
        location /v1/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://proxy_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE / Streaming support
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            chunked_transfer_encoding on;
        }

        # Admin API
        location /admin/ {
            proxy_pass http://proxy_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support for /admin/usage/stream
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        # Health endpoint
        location /health {
            proxy_pass http://proxy_backend;
            proxy_set_header Host $host;
        }

        # Dashboard SPA (catch-all)
        location / {
            proxy_pass http://dashboard_frontend;
            proxy_set_header Host $host;
        }
    }

    # HTTPS server (uncomment and configure for production)
    # server {
    #     listen 443 ssl;
    #     server_name ai.ra-consulting.internal;
    #
    #     ssl_certificate /etc/nginx/certs/ra-internal.crt;
    #     ssl_certificate_key /etc/nginx/certs/ra-internal.key;
    #
    #     # Same location blocks as above
    # }
}
